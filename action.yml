name: TraceDojo agent test compatibility wrapper
description: Forward existing SDK action references to the pinned TraceDojo Action release.
branding:
  icon: shield
  color: gray-dark
inputs:
  config:
    description: Workflow JSON path relative to the checked-out repository
    default: dojo/workflow.json
  adapter:
    description: Trusted local agent adapter path
    default: dojo/adapter.mjs
  trials:
    description: Independent trials per fault, from 1 to 20
    default: "3"
  report:
    description: New report output path; existing files are never overwritten
    default: .tracedojo/action-report.json
outputs:
  report:
    description: Absolute path of the requested report (may be absent after setup failure)
    value: ${{ steps.test.outputs.report }}
runs:
  using: composite
  steps:
    - id: test
      # TraceDojo Action v1.0.0; upgrade this reviewed pin to adopt action fixes.
      uses: syedarman1/tracedojo-action@839a83c3dcfa490884a2c1092d301f8fed2148bb
      with:
        config: ${{ inputs.config }}
        adapter: ${{ inputs.adapter }}
        trials: ${{ inputs.trials }}
        report: ${{ inputs.report }}
