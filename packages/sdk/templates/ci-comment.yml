name: TraceDojo PR comment
on:
  workflow_run:
    workflows: [TraceDojo agent checks]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: tracedojo-comment-${{ github.event.workflow_run.workflow_id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only default-branch code runs with write permission. Never check out PR code here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/tracedojo
      - name: Download comparison data
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: tracedojo-evidence
          path: ${{ runner.temp }}/tracedojo-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Update the TraceDojo comment
        uses: actions/github-script@v7
        env:
          TRACEDOJO_COMPARISON: ${{ runner.temp }}/tracedojo-evidence/comparison.json
        with:
          script: |
            const comment = require('./.github/tracedojo/comment.cjs');
            await comment({ github, context, core });
