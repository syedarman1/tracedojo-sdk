name: TraceDojo agent checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tracedojo-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  agent-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOJO_CONFIG: TRACEDOJO_CONFIG_TEMPLATE
      DOJO_ADAPTER: TRACEDOJO_ADAPTER_TEMPLATE
      DOJO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      DOJO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DOJO_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Find evidence for the exact base commit
        id: baseline
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const current = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.runId });
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: current.data.workflow_id,
              branch: context.payload.pull_request.base.ref,
              head_sha: context.payload.pull_request.base.sha, status: 'completed', per_page: 100,
            });
            const runs = data.workflow_runs.filter(run => ['push', 'workflow_dispatch'].includes(run.event) && run.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}`);
            runs.sort((a, b) => b.id - a.id);
            if (runs[0]) core.setOutput('run-id', runs[0].id);
            else core.notice('No saved report for the exact base commit. Comparison will be incomplete.');
      - name: Download baseline evidence
        if: steps.baseline.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: tracedojo-evidence
          path: .tracedojo/base
          run-id: ${{ steps.baseline.outputs.run-id }}
          github-token: ${{ github.token }}
      - run: npm ci
      - name: Record candidate behavior
        id: candidate
        continue-on-error: true
        run: |
          set +e
          npx --no-install tracedojo test --config "$DOJO_CONFIG" --adapter "$DOJO_ADAPTER" --commit "$DOJO_COMMIT_SHA" --trials 3 --out .tracedojo/report.json --summary .tracedojo/trials.md
          result=$?
          echo "exit-code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Gate new regressions
        if: github.event_name == 'pull_request' && !cancelled()
        env:
          DOJO_TEST_EXIT: ${{ steps.candidate.outputs.exit-code }}
        run: |
          if [ "$DOJO_TEST_EXIT" != "0" ] && [ "$DOJO_TEST_EXIT" != "1" ]; then
            echo "Candidate execution did not produce comparable evidence." >&2
            exit 3
          fi
          npx --no-install tracedojo compare --base .tracedojo/base/report.json --candidate .tracedojo/report.json --base-sha "$DOJO_BASE_SHA" --head-sha "$DOJO_HEAD_SHA" --out .tracedojo/comparison.json --summary .tracedojo/summary.md
      - name: Require passing checks on the base branch
        if: github.event_name != 'pull_request' && steps.candidate.outcome != 'success'
        run: exit 1
      - name: Show results
        if: always()
        run: |
          if [ -f .tracedojo/summary.md ]; then
            cat .tracedojo/summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f .tracedojo/trials.md ]; then
            cat .tracedojo/trials.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve evidence
        if: always() && contains(fromJSON('["0", "1", "3"]'), steps.candidate.outputs.exit-code)
        uses: actions/upload-artifact@v4
        with:
          name: tracedojo-evidence
          path: |
            .tracedojo/report.json
            .tracedojo/comparison.json
            .tracedojo/summary.md
            .tracedojo/trials.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
